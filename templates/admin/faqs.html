{% extends 'admin/layout.html' %}
{% block title %}FAQ{% endblock %}
{% block content %}
<div class="admin-topbar">
  <h1 style="font-size:1.5rem;">FAQ</h1>
  <a href="{{ url_for('admin_faq_new') }}" style="padding:0.6rem 1.2rem;background:#f5c542;color:#0c1929;border-radius:8px;font-weight:600;">+ FAQ</a>
</div>
<table class="admin-table">
  <thead><tr><th>Question</th><th>Order</th><th>Visible</th><th>Actions</th></tr></thead>
  <tbody>
    {% for f in items %}
    <tr>
      <td>{{ f.question[:80] }}</td>
      <td>{{ f.order }}</td>
      <td>{{ 'Yes' if f.is_visible else 'No' }}</td>
      <td><a href="{{ url_for('admin_faq_edit', fid=f.id) }}" style="color:#38bdf8;">Edit</a></td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
