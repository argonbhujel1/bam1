{% extends 'admin/layout.html' %}
{% block title %}FAQ{% endblock %}
{% block content %}
<h1 style="font-size:1.5rem;margin-bottom:1.5rem;">{{ 'Edit' if item else 'New' }} FAQ</h1>
<form method="post" class="admin-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Question *</label><input type="text" name="question" value="{{ item.question if item else '' }}" required>
  <label>Answer *</label><textarea name="answer" rows="5" required>{{ item.answer if item else '' }}</textarea>
  <label>Category</label><input type="text" name="category" value="{{ item.category if item else 'General' }}">
  <label>Order</label><input type="number" name="order" value="{{ item.order if item else 0 }}">
  <label><input type="checkbox" name="is_visible" value="1" {% if not item or item.is_visible %}checked{% endif %}> Visible</label>
  <button type="submit" style="margin-top:1rem;padding:0.75rem 1.5rem;background:#f5c542;color:#0c1929;border:none;border-radius:8px;font-weight:600;">Save</button>
</form>
{% endblock %}
