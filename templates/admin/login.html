<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login — BAM Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      background:#f1f5f9; font-family:Inter,system-ui,sans-serif; color:#0f172a; }
    .box { width:100%; max-width:400px; background:#fff; border:1px solid #e2e8f0; border-radius:16px;
      padding:2rem; box-shadow:0 12px 40px rgba(2,132,199,0.08); }
    .logo { font-family:Orbitron,sans-serif; font-weight:800; letter-spacing:0.08em; color:#0284c7; margin-bottom:1.5rem; text-align:center; }
    label { display:block; font-size:0.85rem; color:#64748b; margin-bottom:0.35rem; }
    input { width:100%; padding:0.75rem; border:1px solid #e2e8f0; border-radius:8px; margin-bottom:1rem; font:inherit; box-sizing:border-box; }
    button { width:100%; padding:0.85rem; border:none; border-radius:8px; font-weight:600; cursor:pointer;
      background:linear-gradient(135deg,#0ea5e9,#6366f1); color:#fff; }
    .flash { padding:0.75rem 1rem; border-radius:8px; margin-bottom:1rem; font-size:0.9rem; }
    .flash.error { background:#fef2f2; color:#dc2626; border:1px solid #fecaca; }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">BAM STUDIO</div>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="flash {{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Email</label>
      <input type="email" name="email" required autofocus>
      <label>Password</label>
      <input type="password" name="password" required>
      <button type="submit">Login</button>
    </form>
  </div>
</body>
</html>
