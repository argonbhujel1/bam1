{% extends 'admin/layout.html' %}
{% block title %}{{ 'Edit' if item else 'New' }} Process Step{% endblock %}
{% block content %}
<h1 style="font-size:1.5rem;margin-bottom:1.5rem;">Process Step</h1>
<form method="post" class="admin-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Step number</label><input type="number" name="step_number" value="{{ item.step_number if item else 1 }}">
  <label>Title *</label><input type="text" name="title" value="{{ item.title if item else '' }}" required>
  <label>What happens</label><textarea name="what_happens" rows="3">{{ item.what_happens if item else '' }}</textarea>
  <label>Client provides</label><textarea name="client_provides" rows="2">{{ item.client_provides if item else '' }}</textarea>
  <label>BAM delivers</label><textarea name="bam_delivers" rows="2">{{ item.bam_delivers if item else '' }}</textarea>
  <label>Order</label><input type="number" name="order" value="{{ item.order if item else 0 }}">
  <label><input type="checkbox" name="is_visible" value="1" {% if not item or item.is_visible %}checked{% endif %}> Visible</label>
  <button type="submit" style="margin-top:1rem;padding:0.75rem 1.5rem;background:#f5c542;color:#0c1929;border:none;border-radius:8px;font-weight:600;">Save</button>
</form>
{% endblock %}
