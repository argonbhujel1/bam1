{% extends 'admin/layout.html' %}
{% block title %}Solutions{% endblock %}
{% block content %}
<div class="admin-topbar">
  <h1 style="font-size:1.5rem;">Solutions</h1>
  <a href="{{ url_for('admin_solution_new') }}" style="padding:0.6rem 1.2rem;background:#f5c542;color:#0c1929;border-radius:8px;font-weight:600;">+ New</a>
</div>
<table class="admin-table">
  <thead><tr><th>Title</th><th>Industry</th><th>Visible</th><th>Actions</th></tr></thead>
  <tbody>
    {% for s in items %}
    <tr>
      <td>{{ s.title }}</td>
      <td>{{ s.industry }}</td>
      <td>{{ 'Yes' if s.is_visible else 'No' }}</td>
      <td><a href="{{ url_for('admin_solution_edit', sid=s.id) }}" style="color:#38bdf8;">Edit</a></td>
    </tr>
    {% else %}<tr><td colspan="4" style="color:#94a3b8;">No solutions</td></tr>{% endfor %}
  </tbody>
</table>
{% endblock %}
