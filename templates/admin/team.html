{% extends 'admin/layout.html' %}
{% block title %}Team{% endblock %}
{% block content %}
<div class="admin-topbar">
  <h1 style="font-size:1.5rem;">Team</h1>
  <a href="{{ url_for('admin_team_new') }}" style="padding:0.6rem 1.2rem;background:#f5c542;color:#0c1929;border-radius:8px;font-weight:600;">+ Add</a>
</div>
<table class="admin-table">
  <thead><tr><th>Name</th><th>Position</th><th>Visible</th><th>Actions</th></tr></thead>
  <tbody>
    {% for m in members %}
    <tr>
      <td>{{ m.name }}</td>
      <td>{{ m.position }}</td>
      <td>{{ 'Yes' if m.is_visible else 'No' }}</td>
      <td><a href="{{ url_for('admin_team_edit', mid=m.id) }}" style="color:#38bdf8;">Edit</a></td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
