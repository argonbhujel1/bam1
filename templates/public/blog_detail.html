{% extends 'layouts/base.html' %}
{% block title %}{{ post.title }} — {{ site.get('site_name', 'BAM Studio') }}{% endblock %}
{% block content %}
<section class="section" style="padding-top:calc(72px + 4rem);">
  <div class="container" style="max-width:720px;" data-reveal>
    <h1 class="h1" style="font-size:clamp(1.75rem,4vw,2.5rem);">{{ post.title }}</h1>
    <p class="text-muted" style="margin:1rem 0 2rem;">{{ post.published_at.strftime('%d %b %Y') if post.published_at else '' }} · {{ post.author }}</p>
    <div class="text-muted" style="line-height:1.8;">{{ post.content|safe }}</div>
  </div>
</section>
{% endblock %}
