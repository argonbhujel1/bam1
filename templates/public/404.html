{% extends 'layouts/base.html' %}
{% block title %}404 — Page not found{% endblock %}

  <div class="container" data-reveal>
    <div style="font-family:var(--font-display);font-size:clamp(4rem,12vw,7rem);font-weight:900;color:var(--color-primary);line-height:1;">404</div>
